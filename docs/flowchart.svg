  <line x1="450" y1="435" x2="530" y2="435" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="488" y="425" font-family="sans-serif" font-size="10" fill="#e74c3c" text-anchor="middle">NO</text>
