  <text x="102" y="962" font-family="sans-serif" font-size="10" fill="#5aaa5a">Matched recipients</text>
  <rect x="100" y="970" width="190" height="64" rx="8" fill="#1e3a1e" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="195" y="1006" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5aaa5a" text-anchor="middle">John</text>
  <rect x="310" y="970" width="190" height="64" rx="8" fill="#1e3a1e" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="405" y="1006" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5aaa5a" text-anchor="middle">Sarah</text>

  <line x1="327" y1="1050" x2="327" y2="1108" stroke="#7c6fc4" stroke-width="2" marker-end="url(#arrow)"/>

