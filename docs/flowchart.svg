  <rect x="192" y="1300" width="270" height="70" rx="12" fill="#1e3a5f" stroke="#3a7bd5" stroke-width="2"/>
  <text x="327" y="1332" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7eb8f7" text-anchor="middle">config.ts</text>
  <text x="327" y="1352" font-family="sans-serif" font-size="10" fill="#5a8ac4" text-anchor="middle">WHAT TO SEND?</text>

