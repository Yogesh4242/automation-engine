  <line x1="327" y1="1370" x2="327" y2="1418" stroke="#7c6fc4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- actions.ts box -->
  <rect x="192" y="1420" width="270" height="70" rx="12" fill="#1e3a5f" stroke="#3a7bd5" stroke-width="2"/>
  <text x="327" y="1452" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7eb8f7" text-anchor="middle">actions.ts</text>
  <text x="327" y="1472" font-family="sans-serif" font-size="10" fill="#5a8ac4" text-anchor="middle">SEND MESSAGE</text>

  <!-- Side annotation -->
  <text x="470" y="1448" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Send WhatsApp</text>

