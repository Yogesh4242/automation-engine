  <!-- log.ts cylinder (top ellipse, body, bottom ellipse) -->
  <ellipse cx="327" cy="1552" rx="110" ry="18" fill="#2d1f5e" stroke="#4c3f8a" stroke-width="2"/>
  <rect x="217" y="1552" width="220" height="65" fill="#2d1f5e" stroke-left="#4c3f8a" stroke-right="#4c3f8a" stroke-width="0"/>
  <line x1="217" y1="1552" x2="217" y2="1617" stroke="#4c3f8a" stroke-width="2"/>
  <line x1="437" y1="1552" x2="437" y2="1617" stroke="#4c3f8a" stroke-width="2"/>
  <ellipse cx="327" cy="1617" rx="110" ry="18" fill="#3a2a7a" stroke="#4c3f8a" stroke-width="2"/>
  <text x="327" y="1582" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c9b8ff" text-anchor="middle">log.ts</text>
  <text x="327" y="1602" font-family="sans-serif" font-size="10" fill="#9b8fd4" text-anchor="middle">RECORD IT</text>

  <!-- Side annotation -->
  <text x="470" y="1570" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Record result</text>

</svg>
