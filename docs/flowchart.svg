<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695.0830078125 1868.8" width="695.0830078125" height="1868.8">
  <!-- svg-source:excalidraw -->

  <rect x="0" y="0" width="695.0830078125" height="1868.8" fill="#1a1a2e"/>

  <!-- CRON box -->
  <rect x="222" y="30" width="210" height="70" rx="35" fill="#4c3f8a" stroke="#7c6fc4" stroke-width="2"/>
  <text x="327" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c9b8ff" text-anchor="middle">&#x23F1; CRON</text>
  <text x="327" y="78" font-family="sans-serif" font-size="11" fill="#9b8fd4" text-anchor="middle">Every 6 hours</text>

  <!-- Arrow down -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c6fc4"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <line x1="327" y1="100" x2="327" y2="138" stroke="#7c6fc4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- /api/cron/automation box -->
  <rect x="192" y="140" width="270" height="70" rx="12" fill="#1e3a5f" stroke="#3a7bd5" stroke-width="2"/>
  <text x="327" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7eb8f7" text-anchor="middle">/api/cron/automation</text>
  <text x="327" y="192" font-family="sans-serif" font-size="10" fill="#5a8ac4" text-anchor="middle">HTTP endpoint</text>

  <line x1="327" y1="210" x2="327" y2="248" stroke="#7c6fc4" stroke-width="2" marker-end="url(#arrow)"/>

