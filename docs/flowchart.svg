  <polygon points="327,370 450,435 327,500 204,435" fill="#5a3e1b" stroke="#c4882a" stroke-width="2"/>
  <text x="327" y="429" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0a840" text-anchor="middle">condition.ts</text>
  <text x="327" y="447" font-family="sans-serif" font-size="10" fill="#c4882a" text-anchor="middle">GLOBAL CHECKS</text>

