  <polygon points="327,1110 450,1180 327,1250 204,1180" fill="#5a3e1b" stroke="#c4882a" stroke-width="2"/>
  <text x="327" y="1174" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0a840" text-anchor="middle">condition.ts</text>
  <text x="327" y="1192" font-family="sans-serif" font-size="10" fill="#c4882a" text-anchor="middle">CAN WE SEND?</text>

