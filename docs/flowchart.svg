  <text x="470" y="556" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Is birthday due?</text>
  <text x="470" y="570" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Is anniversary due?</text>
