  <text x="470" y="1118" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Customer valid?</text>
  <text x="470" y="1132" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Has phone?</text>
  <text x="470" y="1146" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Already sent?</text>
  <text x="470" y="1160" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Other restrictions?</text>

