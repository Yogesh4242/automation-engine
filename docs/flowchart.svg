  <text x="327" y="852" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7eb8f7" text-anchor="middle">trigger.ts</text>
  <text x="327" y="872" font-family="sans-serif" font-size="10" fill="#5a8ac4" text-anchor="middle">WHO matches?</text>

