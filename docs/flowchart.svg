  <line x1="327" y1="1250" x2="327" y2="1298" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="340" y="1278" font-family="sans-serif" font-size="10" fill="#2ecc71">YES</text>

