  <text x="327" y="302" font-family="sans-serif" font-size="10" fill="#5a8ac4" text-anchor="middle">Run the system</text>

  <!-- Side annotation -->
  <text x="470" y="278" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Is master automation enabled?</text>
  <text x="470" y="292" font-family="sans-serif" font-size="9" fill="#9b8fd4">&#x2022; Are automation triggers configured?</text>

  <line x1="327" y1="320" x2="327" y2="368" stroke="#7c6fc4" stroke-width="2" marker-end="url(#arrow)"/>

